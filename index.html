<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>D-42: Ironclad [Omni]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: 'var(--bg)',
                        card: 'var(--card)',
                        text: 'var(--text)',
                        border: 'var(--border)',
                        secondary: 'var(--secondary)',
                        primary: 'var(--primary)'
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
            --secondary: #f1f5f9;
            --primary: #ec4899;
        }
        .dark {
            --bg: #020617;
            --card: #1e293b;
            --text: #e2e8f0;
            --border: #334155;
            --secondary: #0f172a;
            --primary: #f472b6;
        }
        body { background-color: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
        .masonry-grid { column-count: 2; column-gap: 0.8rem; }
        @media (min-width: 768px) { .masonry-grid { column-count: 3; } }
        @media (min-width: 1024px) { .masonry-grid { column-count: 4; } }
        @media (min-width: 1536px) { .masonry-grid { column-count: 5; } }
        .masonry-item { break-inside: avoid; margin-bottom: 0.8rem; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .touch-action-none { touch-action: none; }
    </style>
</head>
<body class="transition-colors duration-300">

    <!-- Status Message Overlay -->
    <div id="status-message" class="hidden fixed top-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full shadow-2xl z-[100] animate-bounce text-sm font-bold"></div>

    <!-- Main UI Container -->
    <div id="app" class="relative min-h-screen pb-24">
        
        <!-- Header -->
        <header class="sticky top-0 z-40 bg-bg/80 backdrop-blur-md border-b border-border px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center text-white shadow-lg shadow-primary/20">
                    <i data-lucide="shield"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">D-42 Ironclad</h1>
                    <div class="flex items-center gap-2 text-[10px] opacity-60 uppercase tracking-widest font-bold">
                        <span id="user-id-display">Connecting...</span>
                    </div>
                </div>
            </div>
            
            <div class="flex gap-2">
                <button onclick="toggleView('favorites')" class="p-2 hover:bg-secondary rounded-full relative">
                    <i data-lucide="heart"></i>
                    <span id="fav-count" class="absolute -top-1 -right-1 bg-primary text-[10px] text-white w-4 h-4 rounded-full flex items-center justify-center">0</span>
                </button>
                <button onclick="toggleView('blacklist')" class="p-2 hover:bg-secondary rounded-full">
                    <i data-lucide="ban"></i>
                </button>
                <button onclick="toggleDarkMode()" class="p-2 hover:bg-secondary rounded-full">
                    <i data-lucide="moon" id="theme-icon"></i>
                </button>
            </div>
        </header>

        <!-- Search Section -->
        <div id="search-section" class="px-4 py-4 max-w-4xl mx-auto">
            <div class="relative flex gap-2">
                <div class="relative flex-1">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 opacity-50"></i>
                    <input id="search-input" type="text" placeholder="Поиск (напр. cat_ears solo...)" 
                        class="w-full pl-10 pr-4 py-3 bg-card border border-border rounded-2xl focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all shadow-sm">
                </div>
                <button id="search-btn" class="bg-primary text-white px-6 py-3 rounded-2xl font-bold hover:opacity-90 transition-active shadow-lg shadow-primary/20">
                    Найти
                </button>
            </div>
        </div>

        <!-- Content Grid -->
        <div id="gallery-container" class="px-4 pb-20">
            <div id="gallery" class="masonry-grid"></div>
            <div id="bottom-loader" class="h-20 flex items-center justify-center opacity-0 transition-opacity">
                <div class="w-8 h-8 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
            </div>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div id="modal" class="fixed inset-0 z-50 bg-black/95 flex-col hidden touch-action-none">
        <div class="flex items-center justify-between p-4 text-white">
            <button onclick="closeModal()" class="p-2 bg-white/10 rounded-full backdrop-blur-md">
                <i data-lucide="chevron-left"></i>
            </button>
            <div class="flex items-center gap-3">
                <button id="hd-toggle" onclick="toggleHD()" class="px-3 py-1 bg-white/10 rounded-lg text-xs font-bold border border-white/20">SD</button>
                <button id="modal-fav-btn" onclick="toggleFavorite(currentPost)" class="p-2 bg-white/10 rounded-full">
                    <i data-lucide="heart" class="w-5 h-5"></i>
                </button>
                <button onclick="sharePost()" class="p-2 bg-white/10 rounded-full">
                    <i data-lucide="share-2" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <div class="flex-1 relative flex items-center justify-center overflow-hidden" id="modal-content">
            <!-- Media goes here -->
        </div>

        <div class="p-4 bg-gradient-to-t from-black/80 to-transparent text-white">
            <div id="modal-tags" class="flex flex-wrap gap-2 text-xs opacity-80 max-h-20 overflow-y-auto no-scrollbar mb-2"></div>
            <div class="flex justify-between items-center">
                <span id="modal-score" class="text-xs font-mono opacity-60">Score: 0</span>
                <a id="modal-source" href="#" target="_blank" class="text-xs text-primary font-bold underline">Source</a>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";

        // Глобальные ссылки
        window.db = null;
        window.auth = null;
        window.analytics = null;
        window.appId = 'rule34-e585e';
        window.currentUserId = null;
        
        // Firestore функции
        window.doc = doc;
        window.setDoc = setDoc;
        window.deleteDoc = deleteDoc;
        window.onSnapshot = onSnapshot; 
        window.collection = collection;

        const firebaseConfig = {
          apiKey: "AIzaSyCQrK8PjdEy3qN4fzPnBJmfjTYg1lmTnn0",
          authDomain: "rule34-e585e.firebaseapp.com",
          databaseURL: "https://rule34-e585e-default-rtdb.firebaseio.com",
          projectId: "rule34-e585e",
          storageBucket: "rule34-e585e.firebasestorage.app",
          messagingSenderId: "142967476094",
          appId: "1:142967476094:web:21aee4b0f953d54237ad2f",
          measurementId: "G-XKQZ0PST2H"
        };

        async function init() {
            try {
                const app = initializeApp(firebaseConfig);
                window.db = getFirestore(app);
                window.auth = getAuth(app);
                window.analytics = getAnalytics(app);
                
                await setPersistence(window.auth, browserLocalPersistence);

                onAuthStateChanged(window.auth, (user) => {
                    if (user) {
                        window.currentUserId = user.uid;
                        document.getElementById('user-id-display').innerText = `ID: ${user.uid.substring(0, 10)}...`;
                        window.startFirebaseListeners();
                    } else {
                        signInAnonymously(window.auth);
                    }
                });
            } catch (e) {
                console.error("Firebase Init Error:", e);
                window.showMessage("Ошибка подключения Firebase", 'red');
            }
        }

        init();
    </script>

    <!-- App Logic -->
    <script>
        const state = {
            posts: [],
            page: 0,
            tags: '',
            isLoading: false,
            favorites: [],
            blacklist: [],
            view: 'gallery', // 'gallery', 'favorites', 'blacklist'
            isHD: false,
            currentIndex: -1
        };

        let currentPost = null;

        // --- Core Functions ---

        async function fetchPosts(clear = false) {
            if (state.isLoading) return;
            state.isLoading = true;
            if (clear) {
                state.page = 0;
                state.posts = [];
                document.getElementById('gallery').innerHTML = '';
            }

            document.getElementById('bottom-loader').style.opacity = '1';

            try {
                // Превращаем черный список в теги исключения для API
                const blacklistQuery = state.blacklist.map(tag => `-${tag}`).join(' ');
                const fullTags = `${state.tags} ${blacklistQuery}`.trim();
                
                const response = await fetch(`https://api.rule34.xxx/index.php?page=dapi&s=post&q=index&json=1&limit=40&pid=${state.page}&tags=${encodeURIComponent(fullTags)}`);
                const data = await response.json();

                if (data && data.length > 0) {
                    const formattedPosts = data.map(post => ({
                        id: String(post.id),
                        fileUrl: post.file_url,
                        sampleUrl: post.sample_url || post.file_url,
                        gridUrl: post.preview_url,
                        type: post.file_url.endsWith('.mp4') || post.file_url.endsWith('.webm') ? 'video' : 'image',
                        score: post.score,
                        tags: post.tags.split(' '),
                        source: post.source
                    }));

                    state.posts = [...state.posts, ...formattedPosts];
                    renderPosts(formattedPosts);
                    state.page++;
                }
            } catch (e) {
                console.error("Fetch error:", e);
            } finally {
                state.isLoading = false;
                document.getElementById('bottom-loader').style.opacity = '0';
                lucide.createIcons();
            }
        }

        function renderPosts(posts) {
            const gallery = document.getElementById('gallery');
            posts.forEach(post => {
                const item = document.createElement('div');
                item.className = 'masonry-item animate-in fade-in duration-500';
                item.onclick = () => openModal(post);
                
                const isVideo = post.type === 'video';
                
                item.innerHTML = `
                    <div class="relative group overflow-hidden rounded-2xl bg-secondary">
                        <img src="${post.gridUrl}" loading="lazy" class="w-full h-auto object-cover transition-transform duration-500 group-hover:scale-110" alt="post">
                        ${isVideo ? `<div class="absolute top-2 right-2 bg-black/50 backdrop-blur-md p-1 rounded-md text-white"><i data-lucide="play" class="w-3 h-3 fill-current"></i></div>` : ''}
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity p-3 flex items-end">
                            <span class="text-white text-[10px] font-bold">#${post.id}</span>
                        </div>
                    </div>
                `;
                gallery.appendChild(item);
            });
            lucide.createIcons();
        }

        // --- Firebase Handlers ---

        window.startFirebaseListeners = () => {
            if (!window.db || !window.currentUserId) return;

            // Избранное
            const favQuery = window.collection(window.db, `artifacts/${window.appId}/users/${window.currentUserId}/favorites`);
            window.onSnapshot(favQuery, (snapshot) => {
                state.favorites = snapshot.docs.map(doc => doc.data());
                document.getElementById('fav-count').innerText = state.favorites.length;
                if (state.view === 'favorites') renderView();
                updateModalFavBtn();
            });

            // Черный список
            const blackQuery = window.collection(window.db, `artifacts/${window.appId}/users/${window.currentUserId}/blacklist`);
            window.onSnapshot(blackQuery, (snapshot) => {
                state.blacklist = snapshot.docs.map(doc => doc.id);
                if (state.view === 'blacklist') renderView();
            });
        };

        async function toggleFavorite(post) {
            if (!window.db || !window.currentUserId) return;
            const isFav = state.favorites.some(f => f.id === post.id);
            const docRef = window.doc(window.db, `artifacts/${window.appId}/users/${window.currentUserId}/favorites`, post.id);

            try {
                if (isFav) {
                    await window.deleteDoc(docRef);
                    window.showMessage("Удалено из избранного", "red");
                } else {
                    await window.setDoc(docRef, { ...post, timestamp: Date.now() });
                    window.showMessage("Добавлено в избранное", "green");
                }
            } catch (e) {
                window.showMessage("Ошибка БД", "red");
            }
        }

        // --- UI Interactions ---

        function openModal(post) {
            currentPost = post;
            state.currentIndex = state.posts.findIndex(p => p.id === post.id);
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            
            content.innerHTML = '';
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            const url = state.isHD ? post.fileUrl : post.sampleUrl;

            if (post.type === 'video') {
                content.innerHTML = `<video src="${url}" controls autoplay loop playsinline class="max-w-full max-h-full"></video>`;
            } else {
                content.innerHTML = `<img src="${url}" class="max-w-full max-h-full object-contain" alt="HD Content">`;
            }

            document.getElementById('modal-tags').innerHTML = post.tags.map(tag => `<span class="bg-white/10 px-2 py-1 rounded">${tag}</span>`).join('');
            document.getElementById('modal-score').innerText = `Score: ${post.score}`;
            document.getElementById('modal-source').href = post.source || '#';
            
            updateModalFavBtn();
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal-content').innerHTML = '';
            document.body.style.overflow = 'auto';
        }

        function updateModalFavBtn() {
            if (!currentPost) return;
            const btn = document.getElementById('modal-fav-btn');
            const isFav = state.favorites.some(f => f.id === currentPost.id);
            btn.style.color = isFav ? '#f472b6' : '#ffffff';
            btn.querySelector('i').style.fill = isFav ? 'currentColor' : 'none';
        }

        function toggleHD() {
            state.isHD = !state.isHD;
            const btn = document.getElementById('hd-toggle');
            btn.innerText = state.isHD ? 'HD' : 'SD';
            btn.classList.toggle('bg-primary', state.isHD);
            if (currentPost) openModal(currentPost);
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('theme-icon').setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        }

        function toggleView(view) {
            state.view = view;
            document.getElementById('search-section').style.display = view === 'gallery' ? 'block' : 'none';
            renderView();
        }

        function renderView() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            
            if (state.view === 'gallery') {
                renderPosts(state.posts);
            } else if (state.view === 'favorites') {
                renderPosts(state.favorites);
            } else if (state.view === 'blacklist') {
                gallery.innerHTML = state.blacklist.map(tag => `
                    <div class="bg-card p-4 rounded-xl flex justify-between items-center mb-2 border border-border">
                        <span class="font-bold"># ${tag}</span>
                        <button onclick="removeFromBlacklist('${tag}')" class="text-red-500"><i data-lucide="trash-2"></i></button>
                    </div>
                `).join('');
                lucide.createIcons();
            }
        }

        async function removeFromBlacklist(tag) {
            const docRef = window.doc(window.db, `artifacts/${window.appId}/users/${window.currentUserId}/blacklist`, tag);
            await window.deleteDoc(docRef);
        }

        window.showMessage = (text, type) => {
            const el = document.getElementById('status-message');
            el.innerText = text;
            el.className = `fixed top-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full shadow-2xl z-[100] animate-bounce text-sm font-bold ${type === 'green' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 3000);
        };

        // --- Listeners ---

        document.getElementById('search-btn').onclick = () => {
            state.tags = document.getElementById('search-input').value;
            state.view = 'gallery';
            fetchPosts(true);
        };

        document.getElementById('search-input').onkeypress = (e) => {
            if (e.key === 'Enter') document.getElementById('search-btn').click();
        };

        window.onscroll = () => {
            if (state.view !== 'gallery') return;
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800) {
                fetchPosts();
            }
        };

        // Initialize
        lucide.createIcons();
        fetchPosts();

    </script>
</body>
</html>
